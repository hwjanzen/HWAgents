            "{TriggerWindowEndToken}":
              displayName: Token für Ende des Zeitfensters auslösen
              description: Ein Token, das die Zeit des aktuellen Datenstroms überprüft. Verwenden Sie diese Option, wenn Sie überprüfen möchten, ob mindestens eine Spalte seit der letzten Überprüfung des Datenstroms geändert wurde.
              order: 35
              type: String

            "{TriggerWindowStartToken}":
              displayName: Token für Start des Zeitfensters auslösen
              description: Ein Token, das die Zeit der letzten Überprüfung des Datenstroms ausdrückt. Verwenden Sie diese Option, wenn Sie überprüfen möchten, ob mindestens eine Spalte seit der letzten Überprüfung des Datenstroms geändert wurde.
