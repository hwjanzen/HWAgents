              displayName: IstOrdner
              description: Wahr, wenn das Element in einem Ordner ist, andernfalls falsch.
              order: 18
              type: Boolean

            "{Link}":
              displayName: Link zu Element
              description: Ein Link, der verwendet werden kann, um zu der Datei oder dem Listenelement zu gelangen. Nur Personen mit Berechtigungen für das Element können den Link öffnen.
              order: 20
              type: String

            "{ModerationComment}":
