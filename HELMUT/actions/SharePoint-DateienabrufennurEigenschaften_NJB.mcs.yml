              description: Die der Moderation des Listenelements zugeordnete Kommentare.
              order: 26
              type: String

            "{ModerationStatus}":
              displayName: Inhaltsgenehmigungsstatus
              description: "Der inhaltsgenehmigungsstatus. Es kann eine der folgenden sein: Entwurf, Ausstehend, genehmigt oder abgelehnt"
              order: 25
              type: String

            "{Name}":
              displayName: Name
              description: Der Dateiname des Elements in Dokumentbibliotheken, der Anzeigename des Elements in Listen.
              order: 21
              type: String

            "{Path}":
              displayName: Ordnerpfad
              description: Der Pfad zu dem Ordner, indem sich das Element befindet, relativ zur Siteadresse.
