mcs.metadata:
  componentName: SharePoint - Dateien abrufen (nur Eigenschaften)
kind: TaskDialog
inputs:
  - kind: ManualTaskInput
    propertyName: dataset
    value: https://hanfwolf.sharepoint.com/sites/HanfwolfIntranet

  - kind: ManualTaskInput
    propertyName: table
    value: cef0bd74-646a-4eac-8684-57041c4cb65a

modelDisplayName: Dateien abrufen aus IT Anforderungen
modelDescription: |-
  Hiermit werden die in den Spalten der Bibliothek enthaltenen Eigenschaften für alle Ordner und Dateien abgerufen, die in der Bibliothek gespeichert sind.
              Sie können auch nach Elementen filtern, die eine bestimmte Bedingung erfüllen. Ein „Auf alle anwenden“-Bereich wird üblicherweise dazu verwendet, um mit der Ausgabe dieser Aktion zu arbeiten.
              Bei Einsatz mit dem lokalen Datengateway muss der Name der Bibliothek für die Verbindungsherstellung möglicherweise manuell eingegeben werden.
outputs:
  - propertyName: value
    name: value
    description: List of Items

action:
  kind: InvokeConnectorTaskAction
  connectionReference: crb27_HELMUT.shared_sharepointonline.shared-sharepointonl-7eda02fc-b31c-44d6-8d7f-b50c2906b4d1
  connectionProperties:
    mode: Invoker

  operationId: GetFileItems
  dynamicOutputSchema:
    kind: Record
    properties:
      value:
        description: List of Items
        order: 0
        type:
          kind: Table
          properties:
            "{ContentType}":
              displayName: Inhaltstyp
              description: Der Name des Inhaltstyps des Elements.
              order: 27
              type:
                kind: Record
                properties:
                  Id:
                    displayName: Id
                    order: 0
                    dynamicValuesConfig:
                      capability: List

                    type: String

                  Name:
                    displayName: Name
                    order: 1
                    type: String

            "{DriveId}":
              displayName: Laufwerk-ID
              description: Eindeutiger Bezeichner für die Dokumentenbibliothek in MS Graph
              order: 29
              type: String

            "{DriveItemId}":
              displayName: Laufwerkelement-ID
              description: Eindeutiger Bezeichner für die Datei in MS Graph.
              order: 30
              type: String

            "{FilenameWithExtension}":
              displayName: Dateiname mit Erweiterung
              description: Gibt bei Bibliotheken den Dateinamen mit Erweiterung zurück. Gibt bei Listen die "Title"-Eigenschaft zurück.
              order: 22
              type: String

            "{FullPath}":
              displayName: Vollständiger Pfad
