name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate all manifests
        run: node tools/cli/generate-manifest.js
      - name: Run manifest baseline validation
        run: node tools/cli/validate-all.js
      - name: Check for uncommitted manifest changes
        run: |
          git diff --exit-code skills/manifest/ || \
          (echo "Generated manifests differ from committed. Run 'npm run manifest:generate' and commit." && exit 1)
